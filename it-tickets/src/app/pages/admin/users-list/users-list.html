<div class="page-header pt-3">
  <h2 class="title-class">Utenti</h2>
</div>

<div class="users-class pb-3 mat-elevation-z4">
  <div class="table-header">
    <div class="filters">
      <mat-form-field
        appearance="outline"
        floatLabel="always"
        class="custom-input small-field"
      >
        <mat-label>Ruolo</mat-label>
        <mat-select
          [(value)]="selectedRole"
          (selectionChange)="onFilterChange(selectedRole)"
        >
          <mat-option value="">Tutti</mat-option>
          <mat-option *ngFor="let r of roles" [value]="r.name">
            {{ r.name }}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <div class="ricerca">
      <mat-form-field
        appearance="outline"
        floatLabel="always"
        class="custom-input small-field"
      >
        <mat-label>Ricerca</mat-label>
        <input
          matInput
          [(ngModel)]="searchKeyword"
          (ngModelChange)="onFilterChange($event)"
        />
        <button
          mat-icon-button
          matPrefix
          (click)="onFilterChange(searchKeyword)"
        >
          <mat-icon>search</mat-icon>
        </button>
      </mat-form-field>
    </div>
  </div>

  <div class="table-container">
    <mat-table
      *ngIf="usersList.length > 0; else noUsersFound"
      [dataSource]="usersList"
      class="big-table"
    >
      <!-- Highest role column -->
      <ng-container matColumnDef="highestRole">
        <mat-header-cell class="mycell" *matHeaderCellDef>
          Ruolo principale
        </mat-header-cell>
        <mat-cell *matCellDef="let user">
           <span class="ellipsis-text">{{ user.highestRole }}</span>
        </mat-cell>
      </ng-container>

      <!-- Email column -->
      <ng-container matColumnDef="email">
        <mat-header-cell class="mycell" *matHeaderCellDef>
          Email
        </mat-header-cell>
        <mat-cell *matCellDef="let user">
           <span class="ellipsis-text">{{ user.email }}</span>
        </mat-cell>
      </ng-container>

      <!-- Name column -->
      <ng-container matColumnDef="name">
        <mat-header-cell class="mycell" *matHeaderCellDef>
          Nome
        </mat-header-cell>
        <mat-cell *matCellDef="let user">
           <span class="ellipsis-text">{{ user.name }}</span>
        </mat-cell>
      </ng-container>

      <!-- Surname column -->
      <ng-container matColumnDef="surname">
        <mat-header-cell class="mycell" *matHeaderCellDef>
          Cognome
        </mat-header-cell>
        <mat-cell *matCellDef="let user">
           <span class="ellipsis-text">{{ user.surname }}</span>
        </mat-cell>
      </ng-container>

      <!-- Details / action column -->
      <ng-container matColumnDef="details">
        <mat-header-cell class="mycell" *matHeaderCellDef>
        </mat-header-cell>
        <mat-cell *matCellDef="let user">
          <button mat-icon-button color="primary" (click)="openUserDetails(user)">
            <mat-icon class="my-icon">launch</mat-icon>
          </button>
        </mat-cell>
      </ng-container>

      <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
      <mat-row *matRowDef="let row; columns: displayedColumns"></mat-row>
    </mat-table>

    <ng-template #noUsersFound>
      <div class="no-results">
        <span *ngIf="!searched; else noSearch">Nessun utente presente</span>
        <ng-template #noSearch>
          Nessun elemento trovato per i criteri di ricerca
        </ng-template>
      </div>
    </ng-template>
  </div>

  <mat-paginator
    [length]="totalUsers"
    [pageSize]="pageSize"
    [pageIndex]="pageIndex"
    [pageSizeOptions]="[5, 10, 20]"
    (page)="onPageChange($event)"
  >
  </mat-paginator>
</div>
