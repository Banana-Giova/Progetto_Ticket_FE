<div class="row">
    <div class="col-6">Ciao DIv </div>
    <div class="col-6">Ciao sono DIv</div>
</div>

<mat-card class="example-card" appearance="outlined">
  <mat-card-header>
    <mat-card-title>Chihuahua</mat-card-title>
  </mat-card-header>
  
  <mat-card-content>
    <p>{{longText}}</p>
  </mat-card-content>
  
  <!-- Invece di mat-card-footer, puoi usare un div o mat-card-actions -->
  <mat-card-actions class="example-card-footer">
    <mat-chip-set aria-label="Chihuahua traits">
      <mat-chip>charming</mat-chip>
      <mat-chip>graceful</mat-chip>
      <mat-chip>sassy</mat-chip>
    </mat-chip-set>
  </mat-card-actions>
</mat-card>
