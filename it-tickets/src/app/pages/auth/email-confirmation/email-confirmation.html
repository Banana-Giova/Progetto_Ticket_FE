<mat-card class="card-class">
  <mat-card-header>
    <mat-card-title class="card-title">Conferma Email</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <div class="form-row">
      <p style="margin-bottom: 16px;">
        Per confermare il proprio account inserisci qui la tua email<br>
        e clicca il pulsante sottostante.
      </p>
      <button 
        mat-raised-button 
        class="token-send-button"
        (click)="confirmEmail()">
        Verifica l'email del tuo account
      </button>
    </div>
  </mat-card-content>
</mat-card>
