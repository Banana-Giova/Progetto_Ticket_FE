<div class="wrapper">
  <mat-card class="card-class">
    <mat-card-header>
      <mat-card-title class="card-title">Reset Password</mat-card-title>
    </mat-card-header>
    <mat-card-content class="content">
      <div class="form-row">
        <mat-form-field appearance="outline" floatLabel="always" class="single-field">
          <mat-label>Vecchia Password</mat-label>
          <input
            id="old-password-field"
            matInput
            required
            [(ngModel)]="model.oldPassword"
            [type]="hideOld ? 'password' : 'text'"
            placeholder="Inserisci la vecchia password">
          <button
            mat-icon-button
            matSuffix
            (click)="hideOld = !hideOld"
            class="password-button">
            <mat-icon>{{ hideOld ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>

        <mat-form-field appearance="outline" floatLabel="always" class="single-field">
          <mat-label [class.has-error]="newPasswordField.touched && !model.isValidPassword()">Nuova Password</mat-label>
          <input
            id="new-password-field"
            matInput
            required
            [(ngModel)]="model.newPassword"
            #newPasswordField="ngModel"
            [type]="hideNew ? 'password' : 'text'"
            placeholder="Inserisci la nuova password">
          <button
            mat-icon-button
            matSuffix
            (click)="hideNew = !hideNew"
            class="password-button">
            <mat-icon class="eye_icon">{{ hideNew ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>

        <mat-form-field appearance="outline" floatLabel="always" class="single-field">
          <mat-label [class.has-error]="confirmPasswordField.touched && !model.isValidPassword()">Conferma Nuova Password</mat-label>
          <input
            id="confirm-password-field"
            matInput
            required
            [(ngModel)]="model.confirmPassword"
            #confirmPasswordField="ngModel"
            [type]="hideNew ? 'password' : 'text'"
            placeholder="Conferma la nuova password">
          <button
            mat-icon-button
            matSuffix
            (click)="hideNew = !hideNew"
            class="password-button">
            <mat-icon class="eye_icon">{{ hideNew ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>
      </div>

      <div class="actions">
        <button
          mat-raised-button
          class="registration-button"
          [disabled]="!model.isValidPassword()"
          (click)="resetPassword()">
          Reset Password
        </button>
      </div>
    </mat-card-content>
  </mat-card>
</div>
