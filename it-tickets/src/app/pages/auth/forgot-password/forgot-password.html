<div class="wrapper">
  <mat-card class="card-class">
    <mat-card-header>
      <mat-card-title class="card-title">Password Dimenticata</mat-card-title>
    </mat-card-header>
    <mat-card-content class="content">

      <p class="intro">
        Segui questi semplici passaggi:
      </p>
      <ol class="procedure-steps">
        <li>Inserisci la tua email qui sotto e clicca “Invia email”.</li>
        <li>Riceverai una email con una <strong>password temporanea</strong> e un link per accedere.</li>
        <li>Accedi con la password temporanea, poi scegli una nuova password definitiva.</li>
      </ol>

      <div class="form-row">
        <mat-form-field appearance="fill" class="single-field">
          <mat-label [class.has-error]="emailField.touched && !model.isValidEmail()">Email</mat-label>
          <input
            id="user-mail-field"
            matInput
            required
            [(ngModel)]="model.userEmail"
            #emailField="ngModel"
            placeholder="Inserisci la tua email">
        </mat-form-field>
      </div>

      <div class="actions">
        <button
          mat-raised-button
          class="registration-button"
          [disabled]="!model.isValidEmail()"
          (click)="forgotPassword()">
          Invia email
        </button>
      </div>
    </mat-card-content>
  </mat-card>
</div>
