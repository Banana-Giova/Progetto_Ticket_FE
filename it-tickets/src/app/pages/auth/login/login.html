<mat-card>
  <div class="email">
    <mat-form-field appearance="fill" class="full-width">
      <mat-label [class.has-error]="emailField.touched && !model.isValidEmail()"
        >Enter your Email</mat-label
      >
      <input
        matInput
        type="email"
        [(ngModel)]="model.email"
        #emailField="ngModel"
        name="email"
        placeholder="email"
        required
      />
    </mat-form-field>

    <div class="password">
      <mat-form-field appearance="fill" class="full-width">
        <mat-label [class.has-error]="passwordField.touched && !model.isValidPassword()">
          Enter your Password</mat-label
        >
        <input
          matInput
          [type]="hide ? 'password' : 'text'"
          [(ngModel)]="model.password"
          #passwordField="ngModel"
          name="password"
          placeholder="password"
          required
        />
        <button
          mat-icon-button
          matSuffix
          (click)="hide = !hide"
        >
          <mat-icon>{{ hide ? "visibility_off" : "visibility" }}</mat-icon>
        </button>
      </mat-form-field>
    </div>
    <div class="row">
      <div class="col-12 d-flex justify-content-center">
        <button
          class="mybutton"
          (click)="login()"
          mat-raised-button
          type="button"
          [disabled]="!(model.isValidEmail() && model.isValidPassword())"
        >
          Login
        </button>
      </div>
    </div>
  </div></mat-card
>
