<mat-card class="tickets-class" class="mat-elevation-z8">
    <mat-card-title class="title-class">Ticket inviati</mat-card-title>
<mat-table [dataSource]="tickets" > 
  <!-- | async -->
    
  <ng-container matColumnDef="title">
    <mat-header-cell *matHeaderCellDef> Titolo </mat-header-cell>
    <mat-cell *matCellDef="let tickets"> {{tickets.title}} </mat-cell>
  </ng-container>

  <ng-container matColumnDef="description">
    <mat-header-cell *matHeaderCellDef> Descrizione </mat-header-cell>
    <mat-cell *matCellDef="let tickets"> {{tickets.description}} </mat-cell>
  </ng-container>

  <ng-container matColumnDef="category">
    <mat-header-cell *matHeaderCellDef> Categoria </mat-header-cell>
    <mat-cell *matCellDef="let tickets"> {{tickets.category.name}} </mat-cell>
  </ng-container>

  <ng-container matColumnDef="is_priority">
    <mat-header-cell *matHeaderCellDef> Priorità </mat-header-cell>
    <mat-cell *matCellDef="let tickets"> 
    <mat-icon *ngIf="tickets.is_priority">check</mat-icon>
    <mat-icon *ngIf="!tickets.is_priority">close</mat-icon>
    </mat-cell>
  </ng-container>

  <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
  <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
</mat-table>
</mat-card>

<button matButton="elevated" class="class-button" (click)="openDialog()">Aggiungi Ticket</button>
